[project]
name = "portfolio"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.19.1",
    "asyncpg>=0.31.0",
    "fastapi[standard]>=0.140.2",
    "httpx>=0.28.0",
    "itsdangerous>=2.2.0",
    "jinja2>=3.1.6",
    "markdown-it-py>=4.2.0",
    "plotly>=7.1.0",
    "pydantic-settings>=2.14.2",
    "pypdf>=6.21.1",
    "python-frontmatter>=1.3.0",
    "python-multipart>=0.0.32",
    "redis>=8.1.0",
    "slowapi>=0.1.10",
    "sqlalchemy[asyncio]>=2.0.52",
    "structlog>=26.1.0",
    "uvicorn>=0.51.0",
]

[dependency-groups]
dev = [
    "djlint>=1.49.3",
    "pytest>=9.1.1",
    "ruff>=0.16.0",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff.lint.isort]
# The local alembic/ migrations folder would otherwise make ruff treat the library as first-party.
known-third-party = ["alembic"]

[tool.djlint]
profile = "jinja"
indent = 4
max_line_length = 100
