<nav aria-label="Main">
    <ul class="nav-tabs">
        {% for route, label in [("home", "Home"), ("about", "About"), ("contact", "Contact")] %}
            {% set href = url_for(route) %}
            <li>
                <a class="nav-tab"
                   href="{{ href }}"
                   {% if request.url.path == href.path %}aria-current="page"{% endif %}><span class="nav-tab-label nav-tab-label--{{ route }}">{{ label }}</span></a>
            </li>
        {% endfor %}
    </ul>
</nav>
